<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="t d" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14">
  <title id="t">From issue to verified apply</title>
