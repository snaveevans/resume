    <text x="380" y="241">Sticky plan comment on the PR</text>
    <text x="380" y="305">Codex review, bot fixes findings</text>
    <text x="380" y="366">Apply runner hook</text><text x="380" y="384" font-size="12" fill="#4e5650">apply workflow from main only</text>
    <text x="380" y="443">Re-plan on main</text>
    <text x="380" y="504" fill="#f4efe4">Drift guard</text><text x="380" y="522" font-size="12" fill="#f4efe4">same as the PR's plan?</text>
